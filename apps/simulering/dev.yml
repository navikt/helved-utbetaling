apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: simulering
  namespace: helved
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
  labels:
    team: helved
spec:
  image: {{image}}
  terminationGracePeriodSeconds: 70
  accessPolicy:
    inbound:
      rules:
        - application: utsjekk
        - application: snickerboa
        - application: tiltakspenger-saksbehandling-api
          namespace: tpts
        - application: tilleggsstonader-sak
          namespace: tilleggsstonader
        - application: azure-token-generator
          namespace: nais
          cluster: dev-gcp
        - application: utbetal
          namespace: aap
        - application: dp-mellom-barken-og-veden
          namespace: teamdagpenger
    outbound:
      external:
        - host: helved-ws-proxy.dev-fss-pub.nais.io
      rules:
        - application: logging
          namespace: nais-system
        - application: helved-ws-proxy
          cluster: dev-fss
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 512Mi
      cpu: 180m
  replicas:
    min: 1
    max: 1
  azure:
    application:
      enabled: true
      claims:
        groups:
          - id: "928636f4-fd0d-4149-978e-a6fb68bb19de"
  liveness:
    path: /actuator/live
    initialDelay: 30
    periodSeconds: 5
  readiness:
    path: /actuator/ready
    initialDelay: 10
    periodSeconds: 5
    failureThreshold: 30
  prometheus:
    path: /actuator/metrics
    enabled: true
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
  envFrom:
    - secret: utsjekk-oppdrag-simulering
  kafka:
    pool: nav-dev
    streams: true
  env:
    - name: PROXY_HOST
      value: https://helved-ws-proxy.dev-fss-pub.nais.io
    - name: PROXY_SCOPE
      value: api://dev-fss.helved.ws-proxy/.default
    - name: SIMULERING_PATH
      value: cics/oppdrag/simulerFpServiceWSBinding
